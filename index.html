<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Portfolio of Keith Crismond B. Oropesa, software developer and UI/UX designer.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Oropesa Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: '#0D0E11',
          panel: '#16161A',
          copper: '#E3936A',
          steel: '#7FA6CF',
          ink: '#F5F0E8',
          mute: '#BDB5A9'
        },
        fontFamily: {
          head: ['Space Grotesk', 'Poppins', 'system-ui', 'sans-serif'],
          body: ['Inter', 'system-ui', 'sans-serif']
        }
      }
    }
  };
</script>
<style>
  /* Design plan: dark navy ground, copper as the primary accent and steel as the secondary.
     One card style, one button style, Space Grotesk for headings and Inter for body.
     Layout: hero with an animated code window, then one section per topic on the same grid. */
  :root {
    --navy: #0D0E11;
    --panel: rgba(22, 22, 26, 0.6);
    --copper: #E3936A;
    --steel: #7FA6CF;
    --text: #F5F0E8;
    --muted: #BDB5A9;
    --line: rgba(255, 240, 225, 0.15);
    --radius-card: 1rem;
    --radius-btn: 0.75rem;
    --shadow-card: 0 12px 32px -14px rgba(0, 0, 0, 0.7);
    --glow: 0 0 0 1px rgba(227, 147, 106, 0.45), 0 0 32px rgba(227, 147, 106, 0.18);
    --font-head: 'Space Grotesk', 'Poppins', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --photo-filter: none;
    --reed: repeating-linear-gradient(90deg, rgba(255, 240, 225, 0.04) 0 1px, transparent 1px 6px);
    color-scheme: dark;
  }
  html { scroll-behavior: smooth; }
  body {
    background: var(--navy);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 60;
    background: var(--navy);
  }
  section[id] { scroll-margin-top: 72px; }
  h1, h2, h3 { font-family: var(--font-head); letter-spacing: -0.02em; text-wrap: balance; }
  p { margin: 0; }
  :focus-visible { outline: 2px solid var(--copper); outline-offset: 3px; }
  ::selection { background: rgba(227, 147, 106, 0.35); }

  .wrap {
    width: 100%;
    max-width: 72rem;
    margin-inline: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .eyebrow { color: var(--copper); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; }

  /* shared components */
  .card {
    background-color: var(--panel);
    background-image: var(--reed);
    -webkit-backdrop-filter: blur(14px) saturate(1.1);
    backdrop-filter: blur(14px) saturate(1.1);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .card-hover:hover { transform: translateY(-6px); border-color: rgba(227, 147, 106, 0.45); box-shadow: var(--shadow-card), var(--glow); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 0.75rem 1.25rem;
    border-radius: var(--radius-btn);
    font: 600 0.92rem var(--font-body);
    border: 1px solid transparent;
    text-decoration: none;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease, border-color .2s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary { background: var(--copper); color: var(--navy); }
  .btn-primary:hover { box-shadow: var(--glow); }
  .btn-ghost { background: transparent; color: var(--text); border-color: rgba(227, 147, 106, 0.5); }
  .btn-ghost:hover { background: rgba(227, 147, 106, 0.1); box-shadow: var(--glow); }
  .btn-sm { padding: 0.5rem 0.9rem; font-size: 0.82rem; }
  .chip {
    display: inline-flex; align-items: center;
    padding: 0.3rem 0.7rem;
    border: 1px solid var(--line);
    border-radius: 9999px;
    background: rgba(255, 240, 225, 0.06);
    font-size: 0.8rem; font-weight: 500;
    transition: border-color .2s ease, color .2s ease;
  }
  .chip:hover { border-color: rgba(227, 147, 106, 0.6); color: var(--copper); }
  .icon-box {
    display: grid; place-items: center;
    width: 2.75rem; height: 2.75rem;
    border-radius: var(--radius-btn);
    background: rgba(227, 147, 106, 0.12);
    color: var(--copper);
  }

  /* nav */
  .nav { background: rgba(13, 14, 17, 0.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  /* animated black hole logo */
  .brand-orb { display: block; width: 2.7rem; height: 2.7rem; flex: none; filter: drop-shadow(0 0 7px rgba(227, 147, 106, 0.4)); }
  .brand-orb svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .brand-orb .bh-glow { transform-box: view-box; transform-origin: 20px 20px; animation: bh-breathe 4s ease-in-out infinite; }
  .brand-orb .bh-disk { fill: none; stroke: url(#bhDisk); stroke-linecap: round; }
  .brand-orb .bh-disk.a { stroke-width: 2.4; stroke-dasharray: 30 12; animation: bh-flow-a 2.6s linear infinite; }
  .brand-orb .bh-disk.b { stroke-width: 1.1; stroke-dasharray: 9 17; animation: bh-flow-b 1.7s linear infinite reverse; }
  .brand-orb .bh-disk.back { opacity: 0.5; }
  .brand-orb .bh-hole { fill: #000; stroke: rgba(227, 147, 106, 0.55); stroke-width: 0.5; }
  .brand-orb .bh-ring { fill: none; stroke: #F5F0E8; stroke-width: 0.9; opacity: 0.85; }
  .brand-orb .bh-p { fill: var(--text); opacity: 0; transform-box: view-box; transform-origin: 20px 20px; animation: bh-fall 3.6s cubic-bezier(.5, 0, .9, .6) infinite; }
  a:hover .brand-orb .bh-disk.a { animation-duration: 1s; }
  a:hover .brand-orb .bh-disk.b { animation-duration: 0.7s; }
  @keyframes bh-flow-a { to { stroke-dashoffset: -42; } }
  @keyframes bh-flow-b { to { stroke-dashoffset: -26; } }
  @keyframes bh-fall { 0% { transform: rotate(0deg) scale(1.05); opacity: 0; } 15% { opacity: 1; } 100% { transform: rotate(520deg) scale(0.22); opacity: 0; } }
  @keyframes bh-breathe { 50% { transform: scale(1.12); opacity: 0.7; } }
  .navlink { position: relative; font-size: 0.9rem; font-weight: 500; color: var(--muted); text-decoration: none; padding-block: 4px; transition: color .2s ease; }
  .navlink::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: var(--copper); transform: scaleX(0); transform-origin: left; transition: transform .25s ease; }
  .navlink:hover { color: var(--text); }
  .navlink:hover::after { transform: scaleX(1); }
  .menu-btn { display: grid; place-items: center; width: 2.5rem; height: 2.5rem; border-radius: var(--radius-btn); border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }

  /* hero background */
  .orb { position: absolute; border-radius: 9999px; filter: blur(80px); pointer-events: none; }
  .orb-copper { width: 420px; height: 420px; background: var(--copper); opacity: 0.14; top: -120px; left: -100px; animation: drift1 18s ease-in-out infinite alternate; }
  .orb-steel { width: 360px; height: 360px; background: var(--steel); opacity: 0.11; bottom: -140px; right: -60px; animation: drift2 22s ease-in-out infinite alternate; }
  .grid-bg {
    position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255, 240, 225, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 240, 225, 0.07) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 30%, transparent 75%);
    mask-image: radial-gradient(ellipse at 50% 40%, #000 30%, transparent 75%);
  }
  @keyframes drift1 { to { transform: translate(120px, 80px); } }
  @keyframes drift2 { to { transform: translate(-110px, -70px); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .fade-up { animation: fadeUp .8s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 90ms); }
  .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--copper); margin-left: 2px; vertical-align: -0.15em; animation: blink 1s steps(1) infinite; }
  .typed { color: var(--text); }

  /* code window */
  .code-head { display: flex; align-items: center; gap: 8px; padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); }
  .code-head i { width: 10px; height: 10px; border-radius: 9999px; background: rgba(255, 240, 225, 0.35); }
  .code-head span { margin-left: 8px; font: 500 0.75rem var(--font-mono); color: var(--muted); }
  .code-body { padding: 1.1rem 1rem 1.25rem; font: 400 0.82rem/1.85 var(--font-mono); overflow-x: auto; white-space: pre; }
  .code-body .line { animation: fadeUp .5s ease both; animation-delay: calc(var(--i) * 140ms + 300ms); }
  .code-body .k { color: var(--steel); }
  .code-body .s { color: var(--copper); }
  .code-body .c { color: var(--muted); }
  .code-body .f { color: #7dd3fc; }
  .float-chip { position: absolute; animation: float 5s ease-in-out infinite; padding: 0.35rem 0.8rem; border-radius: 9999px; background: var(--panel); border: 1px solid rgba(227, 147, 106, 0.4); font: 500 0.75rem var(--font-mono); color: var(--copper); box-shadow: var(--shadow-card); }

  /* reveal on scroll */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s cubic-bezier(.2, .7, .2, 1); transition-delay: var(--delay, 0ms); }
  .reveal.in { opacity: 1; transform: none; }

  /* project thumbnails */
  .thumb { position: relative; aspect-ratio: 16 / 10; padding: 1rem; overflow: hidden; transition: transform .5s ease; }
  .thumb-copper { background: linear-gradient(135deg, #0D0E11 0%, rgba(227, 147, 106, 0.28) 100%); }
  .thumb-steel { background: linear-gradient(135deg, #0D0E11 0%, rgba(127, 166, 207, 0.26) 100%); }
  .thumb-dots i { display: inline-block; width: 8px; height: 8px; border-radius: 9999px; background: rgba(255, 240, 225, 0.4); margin-right: 6px; }
  .thumb-lines { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .bar { display: block; height: 10px; border-radius: 9999px; }
  .bar-0 { background: var(--copper); opacity: 0.85; }
  .bar-1 { background: var(--steel); opacity: 0.7; }
  .bar-2 { background: rgba(255, 240, 225, 0.35); }
  .thumb-glyph { position: absolute; right: 14px; bottom: 4px; font: 700 3.2rem var(--font-head); opacity: 0.14; color: var(--text); }
  .project { overflow: hidden; }
  .project:hover .thumb { transform: scale(1.05); }
  .thumb-wrap { overflow: hidden; border-bottom: 1px solid var(--line); }

  /* form */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 0.85rem; font-weight: 500; }
  .input {
    width: 100%;
    padding: 0.75rem 0.9rem;
    border-radius: var(--radius-btn);
    border: 1px solid var(--line);
    background: var(--navy);
    color: var(--text);
    font: 400 0.95rem var(--font-body);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .input::placeholder { color: #8E877C; }
  .input:focus { outline: none; border-color: var(--copper); box-shadow: 0 0 0 3px rgba(227, 147, 106, 0.2); }
  .input[aria-invalid="true"] { border-color: #F87171; }
  .err { color: #FCA5A5; font-size: 0.8rem; }
  .copy-box { white-space: pre-wrap; word-break: break-word; font: 400 0.85rem/1.7 var(--font-mono); color: var(--muted); background: var(--navy); border: 1px solid var(--line); border-radius: var(--radius-btn); padding: 1rem; max-height: 14rem; overflow: auto; }

  .rail { position: relative; padding-left: 1.75rem; }
  .rail::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(var(--copper), rgba(227, 147, 106, 0.05)); }
  .rail::after { content: ""; position: absolute; left: 0; top: 6px; width: 16px; height: 16px; border-radius: 9999px; background: var(--navy); border: 3px solid var(--copper); box-shadow: 0 0 18px rgba(227, 147, 106, 0.5); }

  /* hero stage: giant surname behind the portrait */
  .stage { position: relative; container-type: inline-size; aspect-ratio: 1 / 1.1; min-height: 360px; overflow: clip; }
  @media (min-width: 768px) { .stage { aspect-ratio: 16 / 8.6; } }
  .stage::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 38% 55% at 50% 38%, rgba(227, 147, 106, 0.2), transparent 72%); }
  .wordmark {
    position: absolute; left: 0; right: 0; top: 6%; margin: 0;
    text-align: center; white-space: nowrap; user-select: none;
    font-family: 'Anton', Impact, 'Arial Narrow', sans-serif; font-weight: 400;
    text-transform: uppercase; line-height: 0.95; letter-spacing: 0.01em;
    font-size: 25vw; font-size: 27cqw;
    color: var(--text);
    background: repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.34) 0 2px, transparent 2px 7px), linear-gradient(180deg, #F5F0E8 30%, rgba(245, 240, 232, 0.3) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 36px rgba(227, 147, 106, 0.3));
  }
  .portrait, .portrait-about {
    filter: var(--photo-filter);
    -webkit-mask-image: linear-gradient(to bottom, #000 76%, transparent 100%), linear-gradient(to right, transparent 0, #000 14%, #000 86%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to bottom, #000 76%, transparent 100%), linear-gradient(to right, transparent 0, #000 14%, #000 86%, transparent 100%);
    mask-composite: intersect;
  }
  .portrait { position: absolute; bottom: 0; left: 0; right: 0; margin-inline: auto; height: 92%; width: auto; max-width: none; z-index: 2; }
  @media (min-width: 768px) { .portrait { height: 100%; } }
  .portrait-about { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 6%; }
  .stage .float-chip { z-index: 3; transition: border-color .25s ease, box-shadow .25s ease, color .25s ease; }
  .stage .float-chip:hover { border-color: var(--copper); box-shadow: var(--glow); color: var(--text); }

  /* icon and widget effects */
  .icon-box { transition: transform .35s cubic-bezier(.3, 1.6, .5, 1), background-color .25s ease, color .25s ease, box-shadow .25s ease; }
  .card:hover .icon-box { background: var(--copper); color: var(--navy); transform: translateY(-3px) rotate(-8deg) scale(1.08); box-shadow: var(--glow); }
  .card-hover:hover { background-image: radial-gradient(360px circle at var(--mx, 50%) var(--my, 50%), rgba(227, 147, 106, 0.16), transparent 65%), var(--reed); }
  .btn { position: relative; overflow: hidden; isolation: isolate; }
  .btn::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.28) 50%, transparent 70%); transform: translateX(-130%); transition: transform .65s ease; }
  .btn:hover::after { transform: translateX(130%); }
  .chip { transition: transform .2s ease, border-color .2s ease, color .2s ease, background-color .2s ease; }
  .chip:hover { transform: translateY(-2px); background: rgba(227, 147, 106, 0.1); }
  .social {
    display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border-radius: 9999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    transition: transform .3s cubic-bezier(.3, 1.6, .5, 1), background-color .25s ease, color .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .social svg { transition: transform .3s ease; }
  .social:hover { transform: translateY(-4px) scale(1.08); background: var(--copper); color: var(--navy); border-color: var(--copper); box-shadow: var(--glow); }
  .social:hover svg { transform: rotate(-10deg) scale(1.12); }

  function Icon(props) {
    var size = props.size || 20;
    return html`<svg className=${props.className || ''} width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" dangerouslySetInnerHTML=${{ __html: ICONS[props.name] }} />`;
  }

  function Reveal(props) {
    var ref = useRef(null);
    var st = useState(false), shown = st[0], setShown = st[1];
    useEffect(function () {
      var el = ref.current;
      if (!el) return;
      if (!('IntersectionObserver' in window)) { setShown(true); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { setShown(true); io.disconnect(); }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -4% 0px' });
      io.observe(el);
      return function () { io.disconnect(); };
    }, []);
    return html`<div ref=${ref} className=${'reveal ' + (shown ? 'in ' : '') + (props.className || '')} style=${{ '--delay': (props.delay || 0) + 'ms' }}>${props.children}</div>`;
  }

  function SectionHead(props) {
    return html`
      <${Reveal} className="mb-10 md:mb-14 max-w-2xl">
        <p className="eyebrow mb-3">${props.eyebrow}</p>
        <h2 className="font-head text-3xl md:text-4xl font-bold">${props.title}</h2>
        ${props.text && html`<p className="text-mute mt-4">${props.text}</p>`}
      <//>
    `;
  }

  function Typewriter(props) {
    var phrases = props.phrases;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var s1 = useState(phrases[0]), text = s1[0], setText = s1[1];
    var s2 = useState(0), idx = s2[0], setIdx = s2[1];
    var s3 = useState(false), del = s3[0], setDel = s3[1];
    useEffect(function () {
      if (reduce) return;
      var full = phrases[idx];
      var t;
      if (!del && text === full) {
        t = setTimeout(function () { setDel(true); }, 2200);
      } else if (del && text === '') {
        setDel(false);
        setIdx((idx + 1) % phrases.length);
      } else {
        t = setTimeout(function () {
          setText(del ? full.slice(0, text.length - 1) : full.slice(0, text.length + 1));
        }, del ? 35 : 70);
      }
      return function () { clearTimeout(t); };
    }, [text, del, idx]);
    return html`<span className="typed">${text}</span><span className="caret" aria-hidden="true"></span>`;
  }

          </div>
          <div className="grid gap-10 lg:grid-cols-[1.25fr_1fr] lg:gap-14 items-end pb-16 md:pb-24">
            <div className="min-w-0 flex flex-col gap-4">
              <p className="eyebrow fade-up" style=${{ '--i': 3 }}>Hi, I'm</p>
              <h1 className="font-head text-3xl sm:text-4xl lg:text-5xl font-bold leading-tight break-words fade-up" style=${{ '--i': 4 }}>${D.name}</h1>
              <h2 className="font-head text-lg md:text-xl font-medium text-copper fade-up" style=${{ '--i': 5 }}>${D.title}.</h2>
              <p className="text-mute text-lg max-w-xl fade-up" style=${{ '--i': 6 }}>${D.intro}</p>
            </div>
            <div className="min-w-0 flex flex-col gap-6 lg:items-end lg:text-right fade-up" style=${{ '--i': 7 }}>
              <p className="font-medium" aria-hidden="true">I build <${Typewriter} phrases=${D.phrases} /></p>
              <div className="flex flex-wrap gap-3 lg:justify-end">
                <a href="#projects" className="btn btn-primary">View My Projects <${Icon} name="arrow" size=${18} /></a>
                <a href="#contact" className="btn btn-ghost">Contact Me</a>
              </div>
              <${Socials} className="lg:justify-end" />
            </div>
          </div>
        </div>
      </section>
    `;
  }

  function About() {
    return html`
      <section id="about" className="py-20 md:py-28 border-t border-white/10">
        <div className="wrap">
          <${SectionHead} eyebrow="About me" title="Building creative digital solutions" />
          <div className="grid gap-10 md:grid-cols-[18rem_1fr] md:gap-14 items-start">
            <${Reveal}>
              <div className="relative mx-auto w-full max-w-xs" style=${{ aspectRatio: '4 / 5' }}>
                <div className="absolute inset-0" style=${{ background: 'radial-gradient(ellipse at 50% 42%, rgba(227,147,106,0.24), transparent 70%)' }}></div>
                <img src=${D.photo} alt=${'Portrait of ' + D.name} className="portrait-about" />
              </div>
            <//>
            <div className="min-w-0 flex flex-col gap-8">
              <${Reveal} className="flex flex-col gap-4 max-w-2xl text-mute text-lg">
                <p>I am a Computer Science student who wants to live in Switzerland and is passionate about technologies, creativity and continuous learning. I have skills in designing, programming and developing creative digital solutions.</p>
                <p>I enjoy exploring new ideas, improving my abilities and turning concepts into meaningful projects. My goal is to grow as a professional, gain more experience and create innovative work that makes a positive impact.</p>
              <//>
              <div className="grid gap-4 sm:grid-cols-2">
                ${QUALITIES.map(function (q, i) {
                  return html`
                    <${Reveal} key=${q[1]} delay=${i * 80}>
                      <div className="card card-hover p-5 h-full flex gap-4">
                        <span className="icon-box shrink-0"><${Icon} name=${q[0]} /></span>
                        <div className="min-w-0">
                          <h3 className="font-head font-medium text-lg">${q[1]}</h3>
                          <p className="text-mute text-sm mt-1">${q[2]}</p>
                        </div>
                      </div>
                    <//>
                  `;
                })}
              </div>
            </div>
          </div>
        </div>
      </section>
    `;
  }

  function Skills() {
    return html`
      <section id="skills" className="py-20 md:py-28 border-t border-white/10">
        <div className="wrap">
          <${SectionHead} eyebrow="Skills and technologies" title="What I work with" text="The languages, tools and design skills I use in my school projects and personal practice." />
          <div className="grid gap-5 sm:grid-cols-2 lg:grid-cols-6">
            ${SKILLS.map(function (s, i) {
              return html`
                <${Reveal} key=${s.title} delay=${i * 70} className=${s.span}>
                  <div className="card card-hover p-6 h-full flex flex-col gap-5">
                    <div className="flex items-center gap-4">
                      <span className="icon-box shrink-0"><${Icon} name=${s.icon} /></span>
                      <div className="min-w-0">
                        <h3 className="font-head font-medium text-lg">${s.title}</h3>
                        <p className="text-mute text-sm">${s.note}</p>
                      </div>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      ${s.items.map(function (it) { return html`<span key=${it} className="chip">${it}</span>`; })}
                    </div>
                  </div>
                <//>
              `;
            })}
          </div>
        </div>
      </section>
    `;
  }

  function Thumb(props) {
    var p = props.p;
    return html`
      <div className="thumb-wrap">
        <div className=${'thumb thumb-' + p.accent}>
          <div className="thumb-dots"><i></i><i></i><i></i></div>
          ${p.icon ? html`<img className="thumb-icon" src=${p.icon} alt=${p.title + ' app icon'} />` : null}
          <div className="thumb-lines" hidden=${!!p.icon}>
            ${p.bars.map(function (w, i) { return html`<span key=${i} className=${'bar bar-' + (i % 3)} style=${{ width: w + '%' }}></span>`; })}
          </div>
          <span className="thumb-glyph" hidden=${!!p.icon} aria-hidden="true">${p.glyph}</span>
        </div>
      </div>
    `;
  }

  function Projects() {
    return html`
      <section id="projects" className="py-20 md:py-28 border-t border-white/10">
        <div className="wrap">
          <${SectionHead} eyebrow="Projects" title="Selected work" text="School and practice projects, each with a link to the live page and the source code." />
          <div className=${PROJECTS.length === 1 ? 'grid gap-6 max-w-md' : 'grid gap-6 sm:grid-cols-2 lg:grid-cols-3'}>
            ${PROJECTS.map(function (p, i) {
              return html`
                <${Reveal} key=${p.title} delay=${(i % 3) * 80}>
                  <article className="card card-hover project h-full flex flex-col">
                    <${Thumb} p=${p} />
                    <div className="p-6 flex flex-col gap-4 flex-1">
                      <div className="flex flex-wrap gap-2">
                        ${p.tags.map(function (t) { return html`<span key=${t} className="chip" style=${{ fontSize: '0.72rem', padding: '0.2rem 0.6rem' }}>${t}</span>`; })}
                      </div>
                      <h3 className="font-head font-medium text-xl">${p.title}</h3>
                      <p className="text-mute text-sm flex-1">${p.text}</p>
                      <div className="flex flex-wrap gap-3 pt-1">
                        <a href=${p.live} target="_blank" rel="noopener" className="btn btn-primary btn-sm">View Project <${Icon} name="arrow" size=${16} /></a>
                        <a href=${p.repo} target="_blank" rel="noopener" className="btn btn-ghost btn-sm"><${Icon} name="github" size=${16} /> GitHub</a>
                      </div>
                    </div>
                  </article>
                <//>
              `;
            })}
          </div>
        </div>
      </section>
    `;
  }

  function Education() {
    var focus = ['Programming', 'Web Development', 'Databases', 'UI/UX Design'];
    return html`
      <section id="education" className="py-20 md:py-28 border-t border-white/10">
        <div className="wrap">
          <${SectionHead} eyebrow="Education" title="Where I'm studying" />
          <div className="grid gap-6 md:grid-cols-[1.4fr_1fr]">
            <${Reveal}>
              <div className="card p-6 md:p-8 h-full">
                <div className="rail">
                  <p className="text-sm text-copper font-medium" style=${{ fontFamily: 'var(--font-mono)' }}>Currently studying</p>
                  <h3 className="font-head font-bold text-2xl mt-2">${D.degree}</h3>
                  <p className="text-mute mt-1 flex items-center gap-2"><${Icon} name="cap" size=${18} /> ${D.school}</p>
                </div>
              </div>
            <//>
            <${Reveal} delay=${100}>
              <div className="card p-6 md:p-8 h-full flex flex-col gap-4">
                <h3 className="font-head font-medium text-lg">Focus areas</h3>
                <div className="flex flex-wrap gap-2">
                  ${focus.map(function (f) { return html`<span key=${f} className="chip">${f}</span>`; })}
                </div>
              </div>
            <//>
          </div>
        </div>
      </section>
    `;
  }

  function Services() {
    return html`
      <section id="services" className="py-20 md:py-28 border-t border-white/10">
        <div className="wrap">
          <${SectionHead} eyebrow="Services" title="How I can help" text="Work I can take on right now, at a size that suits a student developer." />
          <div className="grid gap-5 sm:grid-cols-2 lg:grid-cols-6">
            ${SERVICES.map(function (s, i) {
              return html`
                <${Reveal} key=${s.title} delay=${i * 70} className=${s.span}>
                  <div className="card card-hover p-6 h-full flex flex-col gap-4">
                    <span className="icon-box"><${Icon} name=${s.icon} /></span>
                    <h3 className="font-head font-medium text-lg">${s.title}</h3>
                    <p className="text-mute text-sm">${s.text}</p>
                  </div>
                <//>
              `;
            })}
          </div>
        </div>
      </section>
    `;
  }

  function Contact() {
    var sv = useState({ name: '', email: '', subject: '', message: '' }), vals = sv[0], setVals = sv[1];
    var se = useState({}), errors = se[0], setErrors = se[1];
    var ss = useState(false), ready = ss[0], setReady = ss[1];
    var sc = useState('Copy message'), copyLabel = sc[0], setCopyLabel = sc[1];
    var boxRef = useRef(null);

    function set(k) { return function (e) { var v = e.target.value; setVals(function (o) { var n = Object.assign({}, o); n[k] = v; return n; }); }; }

    function validate() {
      var er = {};
      if (!vals.name.trim()) er.name = 'Enter your name.';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(vals.email.trim())) er.email = 'Enter a valid email address, like name@example.com.';
      if (!vals.subject.trim()) er.subject = 'Add a short subject.';
      if (!vals.message.trim()) er.message = 'Write your message.';
      return er;
    }

    function submit(e) {
      e.preventDefault();
      var er = validate();
      setErrors(er);
      if (Object.keys(er).length === 0) setReady(true);
    }

    function composed() {
      return 'To: ' + D.email + '\nFrom: ' + vals.name.trim() + ' <' + vals.email.trim() + '>\nSubject: ' + vals.subject.trim() + '\n\n' + vals.message.trim();
    }

    function copy() {
      var done = function (m) { setCopyLabel(m); setTimeout(function () { setCopyLabel('Copy message'); }, 1800); };
      var fallback = function () {
        if (boxRef.current) {
          var r = document.createRange();
          r.selectNodeContents(boxRef.current);
          var s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
        }
        done('Press Ctrl+C');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(composed()).then(function () { done('Copied'); }, fallback);
      } else { fallback(); }
    }

    function field(id, label, type, ph) {
      return html`
        <div className="field">
          <label htmlFor=${id}>${label}</label>
          <input id=${id} className="input" type=${type} placeholder=${ph} value=${vals[id]} onChange=${set(id)} aria-invalid=${errors[id] ? 'true' : 'false'} autoComplete=${id === 'email' ? 'email' : id === 'name' ? 'name' : 'off'} />
          ${errors[id] && html`<span className="err">${errors[id]}</span>`}
        </div>
      `;
    }

    var socials = [['github', D.handles.github, D.social.github], ['linkedin', 'LinkedIn', D.social.linkedin], ['facebook', D.handles.facebook, D.social.facebook]];

    return html`
      <section id="contact" className="py-20 md:py-28 border-t border-white/10">
        <div className="wrap grid gap-12 lg:grid-cols-[1fr_1.1fr]">
          <${Reveal} className="min-w-0 flex flex-col gap-6">
            <div>
              <p className="eyebrow mb-3">Contact me</p>
              <h2 className="font-head text-3xl md:text-4xl font-bold">Let's build something good together.</h2>
            </div>
            <p className="text-mute text-lg max-w-md">Have a project, an internship or a question about my work? Send a message and I'll reply as soon as I can.</p>
            <div className="flex items-center gap-3">
              <span className="icon-box shrink-0"><${Icon} name="mail" /></span>
              <span className="min-w-0 break-all font-medium">${D.email}</span>
            </div>
            <div className="flex flex-wrap gap-3">
              ${socials.map(function (s) {
                return html`<a key=${s[0]} href=${s[2]} target="_blank" rel="noopener" className="btn btn-ghost btn-sm"><${Icon} name=${s[0]} size=${16} /> ${s[1]}</a>`;
              })}
            </div>
          <//>
          <${Reveal} delay=${100} className="min-w-0">
            <div className="card p-6 md:p-8">
              ${!ready ? html`
                <form noValidate onSubmit=${submit} className="flex flex-col gap-5" aria-label="Contact form">
                  <div className="grid gap-5 sm:grid-cols-2">
                    ${field('name', 'Name', 'text', 'Your name')}
                    ${field('email', 'Email', 'email', 'you@example.com')}
                  </div>
                  ${field('subject', 'Subject', 'text', 'What is this about?')}
                  <div className="field">
                    <label htmlFor="message">Message</label>
                    <textarea id="message" className="input" rows="5" placeholder="Tell me a little about your idea" value=${vals.message} onChange=${set('message')} aria-invalid=${errors.message ? 'true' : 'false'}></textarea>
                    ${errors.message && html`<span className="err">${errors.message}</span>`}
                  </div>
                  <button className="btn btn-primary self-start" type="submit"><${Icon} name="send" size=${18} /> Send Message</button>
                </form>
              ` : html`
                <div className="flex flex-col gap-5">
                  <div className="flex items-center gap-3">
                    <span className="icon-box shrink-0"><${Icon} name="check" /></span>
                    <h3 className="font-head font-medium text-xl">Your message is ready</h3>
                  </div>
                  <p className="text-mute text-sm">This page can't send email by itself yet. Copy the message below and send it to ${D.email}.</p>
                  <div className="copy-box" ref=${boxRef}>${composed()}</div>
                  <div className="flex flex-wrap gap-3">
                    <button className="btn btn-primary btn-sm" type="button" onClick=${copy}>${copyLabel}</button>
                    <button className="btn btn-ghost btn-sm" type="button" onClick=${function () { setReady(false); }}>Edit message</button>
                  </div>
                </div>
              `}
            </div>
          <//>
        </div>
      </section>
    `;
  }

  function Footer() {
    return html`
      <footer className="border-t border-white/10 py-10">
        <div className="wrap flex flex-wrap items-center justify-between gap-4">
          <div>
            <p className="font-head font-medium">Thanks for visiting.</p>
            <p className="text-mute text-sm mt-1">© ${D.name}. Built with React and Tailwind CSS.</p>
          </div>
          <a href="#home" className="btn btn-ghost btn-sm"><${Icon} name="up" size=${16} /> Back to top</a>
        </div>
      </footer>
    `;
  }

  function App() {
    useEffect(function () {
      function move(e) {
        var c = e.target.closest && e.target.closest('.card');
        if (!c) return;
        var r = c.getBoundingClientRect();
        c.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        c.style.setProperty('--my', (e.clientY - r.top) + 'px');
      }
      var bar = document.getElementById('progress');
      function onScroll() {
        var d = document.documentElement;
        var max = d.scrollHeight - d.clientHeight;
        if (bar) bar.style.setProperty('--p', max > 0 ? Math.min(1, d.scrollTop / max) : 0);
      }
      document.addEventListener('pointermove', move);
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
      return function () {
        document.removeEventListener('pointermove', move);
        window.removeEventListener('scroll', onScroll);
      };
    }, []);
    return html`
      <${React.Fragment}>
        <${Nav} />
        <main>
          <${Hero} />
          <${About} />
          <${Skills} />
          <${Projects} />
          <${Education} />
          <${Services} />
          <${Contact} />
        </main>
        <${Footer} />
      <//>
    `;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>

</body>
</html>
